name: Portfolio CI

on:
  push:
    branches:
      - main
      - "portfolio-v2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check patch whitespace
        run: git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run portfolio tests
        run: npm test
      - name: Build production bundle
        run: npm run build
